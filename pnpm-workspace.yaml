# pnpm 11 reads its settings here (not from .npmrc).
# Refuse package versions published less than a day ago (pnpm's default, written down on purpose).
minimumReleaseAge: 1440

# Dependencies' install scripts never run unless listed here (pnpm 11 fails the install otherwise).
# esbuild and workerd come with wrangler; neither script is needed to deploy static assets.
allowBuilds:
  esbuild: false
  workerd: false
